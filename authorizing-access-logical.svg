<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Tile 1: app known -->
  <g>
    <rect x="20" y="86" width="150" height="112" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="95" y="120" text-anchor="middle" font-size="14" font-weight="600">The app</text>
    <text x="95" y="138" text-anchor="middle" font-size="14" font-weight="600">is known</text>
    <text x="95" y="166" text-anchor="middle" font-size="11.5" fill="#555">CMS Library</text>
    <text x="95" y="181" text-anchor="middle" font-size="11.5" fill="#555">software statement</text>
  </g>

  <line x1="170" y1="142" x2="204" y2="142" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Tile 2: Maria known -->
  <g>
    <rect x="208" y="86" width="150" height="112" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="283" y="120" text-anchor="middle" font-size="14" font-weight="600">Maria is known</text>
    <text x="283" y="138" text-anchor="middle" font-size="14" font-weight="600">at IAL2</text>
    <text x="283" y="166" text-anchor="middle" font-size="11.5" fill="#555">the app sends her</text>
    <text x="283" y="181" text-anchor="middle" font-size="11.5" fill="#555">to the CSP, as today</text>
  </g>

  <text x="385" y="128" text-anchor="middle" font-size="10.5" fill="#777">id_token</text>
  <line x1="358" y1="142" x2="410" y2="142" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Group: Maria decides -->
  <g>
    <text x="606" y="46" text-anchor="middle" font-size="12" font-style="italic" fill="#0f5132">Maria decides, informed by the map — in either order</text>
    <rect x="416" y="56" width="380" height="172" rx="11" fill="none" stroke="#9db8aa" stroke-width="1.2" stroke-dasharray="7 5"/>

    <!-- Tile 3: grant captured -->
    <rect x="430" y="86" width="160" height="112" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="572" cy="102" r="10.5" fill="#0f5132"/>
    <text x="572" y="106.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">1</text>
    <text x="505" y="116" text-anchor="middle" font-size="14" font-weight="600">Her grant</text>
    <text x="505" y="134" text-anchor="middle" font-size="14" font-weight="600">is captured</text>
    <rect x="440" y="148" width="140" height="18" rx="9" fill="#0f5132"/>
    <text x="510" y="161" text-anchor="middle" font-size="10" fill="#fff">shared service records it</text>
    <rect x="440" y="172" width="140" height="18" rx="9" fill="#fff" stroke="#9db8aa"/>
    <text x="510" y="185" text-anchor="middle" font-size="10" fill="#3c5d4b">the app asserts it</text>

    <!-- coupling -->
    <text x="606" y="148" text-anchor="middle" font-size="16" fill="#555">&#8644;</text>

    <!-- Tile 4: records located -->
    <rect x="622" y="86" width="160" height="112" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="764" cy="102" r="10.5" fill="#0f5132"/>
    <text x="764" y="106.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">2</text>
    <text x="697" y="116" text-anchor="middle" font-size="14" font-weight="600">Her records</text>
    <text x="697" y="134" text-anchor="middle" font-size="14" font-weight="600">are located</text>
    <rect x="632" y="148" width="140" height="18" rx="9" fill="#0f5132"/>
    <text x="702" y="161" text-anchor="middle" font-size="10" fill="#fff">the service sees the map</text>
    <rect x="632" y="172" width="140" height="18" rx="9" fill="#fff" stroke="#9db8aa"/>
    <text x="702" y="185" text-anchor="middle" font-size="10" fill="#3c5d4b">the app sees the map</text>
  </g>

  <text x="825" y="116" text-anchor="middle" font-size="10.5" fill="#777">grant +</text>
  <text x="825" y="129" text-anchor="middle" font-size="10.5" fill="#777">site list</text>
  <line x1="796" y1="142" x2="852" y2="142" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Tile 5: tokens at each data holder, stacked -->
  <g>
    <rect x="866" y="78" width="170" height="112" rx="9" fill="#f4f4f5" stroke="#d4d4d4"/>
    <rect x="862" y="82" width="170" height="112" rx="9" fill="#f4f4f5" stroke="#d4d4d4"/>
    <rect x="858" y="86" width="170" height="112" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="1010" cy="102" r="10.5" fill="#0f5132"/>
    <text x="1010" y="106.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">3</text>
    <text x="936" y="114" text-anchor="middle" font-size="13.5" font-weight="600">Each data holder</text>
    <text x="936" y="131" text-anchor="middle" font-size="13.5" font-weight="600">issues its own token</text>
    <text x="943" y="147" text-anchor="middle" font-size="10" fill="#555">verifies app · Maria · grant</text>
    <rect x="870" y="156" width="60" height="18" rx="9" fill="#0f5132"/>
    <text x="900" y="169" text-anchor="middle" font-size="10" fill="#fff">ticket</text>
    <rect x="936" y="156" width="80" height="18" rx="9" fill="#fff" stroke="#9db8aa"/>
    <text x="976" y="169" text-anchor="middle" font-size="10" fill="#3c5d4b">cms_smart</text>
    <text x="943" y="190" text-anchor="middle" font-size="10.5" fill="#777">then FHIR data flows</text>
  </g>

  <!-- caption: generous spacing, nothing within 14px of anything -->
  <g font-size="11.5" fill="#555">
    <circle cx="226" cy="296" r="6.5" fill="#0f5132"/>
    <text x="242" y="300">core story</text>
    <circle cx="342" cy="296" r="6.5" fill="#fff" stroke="#9db8aa"/>
    <text x="358" y="300">alternative assembly at that choice point</text>
    <circle cx="650" cy="296" r="8.5" fill="#0f5132"/>
    <text x="650" y="300" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">n</text>
    <text x="668" y="300">choice points, detailed below</text>
  </g>
</svg>
