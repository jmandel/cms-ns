<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="lb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072b2"/>
    </marker>
    <marker id="lo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc8400"/>
    </marker>
  </defs>

  <!-- Tile 1: app known -->
  <g>
    <rect x="20" y="118" width="150" height="112" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="95" y="152" text-anchor="middle" font-size="14" font-weight="600">The app</text>
    <text x="95" y="170" text-anchor="middle" font-size="14" font-weight="600">is known</text>
    <text x="95" y="198" text-anchor="middle" font-size="11.5" fill="#555">CMS Library statement</text>
    <text x="95" y="213" text-anchor="middle" font-size="11.5" fill="#555">+ network registration</text>
  </g>

  <line x1="170" y1="174" x2="204" y2="174" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Tile 2: Maria known -->
  <g>
    <rect x="208" y="118" width="150" height="112" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="283" y="152" text-anchor="middle" font-size="14" font-weight="600">Maria is known</text>
    <text x="283" y="170" text-anchor="middle" font-size="14" font-weight="600">at IAL2</text>
    <text x="283" y="198" text-anchor="middle" font-size="11.5" fill="#555">the app sends her</text>
    <text x="283" y="213" text-anchor="middle" font-size="11.5" fill="#555">to the CSP</text>
  </g>

  <text x="381" y="160" text-anchor="middle" font-size="10.5" fill="#777">id_token</text>
  <line x1="358" y1="174" x2="402" y2="174" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Maria-decides dotted box (lanes flow through it) -->
  <text x="742" y="36" text-anchor="middle" font-size="12" font-style="italic" fill="#0f5132">Maria decides what to share, and from which sites</text>
  <rect x="582" y="44" width="320" height="214" rx="11" fill="none" stroke="#9db8aa" stroke-width="1.2" stroke-dasharray="7 5"/>

  <!-- column headers -->
  <g text-anchor="middle">
    <text x="660" y="80" font-size="13" font-weight="600">Her grant</text>
    <text x="660" y="96" font-size="13" font-weight="600">is captured</text>
    <text x="822" y="80" font-size="13" font-weight="600">Her records</text>
    <text x="822" y="96" font-size="13" font-weight="600">are located</text>
    <text x="1018" y="72" font-size="13" font-weight="600">Each data holder</text>
    <text x="1018" y="88" font-size="13" font-weight="600">issues its own token</text>
    <text x="1018" y="103" font-size="10" fill="#555">checks the app, Maria, the grant</text>
  </g>

  <!-- blue lane -->
  <g>
    <rect x="408" y="116" width="742" height="46" rx="23" fill="#e1eef9" stroke="#0072b2" stroke-width="1.4"/>
    <text x="494" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#0b4a75">network-based</text>
    <text x="494" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="#0b4a75">permission tickets</text>
    <line x1="578" y1="124" x2="578" y2="154" stroke="#0072b2" stroke-width="0.7" opacity="0.4"/>
    <text x="660" y="143" text-anchor="middle" font-size="10" fill="#0b4a75">a shared service records it</text>
    <text x="822" y="143" text-anchor="middle" font-size="10" fill="#0b4a75">the service sees the full list</text>
    <text x="1018" y="143" text-anchor="middle" font-size="10" fill="#0b4a75">presents a per-site ticket</text>
    <line x1="1150" y1="139" x2="1166" y2="139" stroke="#0072b2" stroke-width="1.4" marker-end="url(#lb)"/>
  </g>

  <!-- orange lane -->
  <g>
    <rect x="408" y="186" width="742" height="46" rx="23" fill="#fbf0da" stroke="#cc8400" stroke-width="1.4"/>
    <text x="494" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5200">app-based</text>
    <text x="494" y="221" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5200">client assertions</text>
    <line x1="578" y1="194" x2="578" y2="224" stroke="#cc8400" stroke-width="0.7" opacity="0.4"/>
    <text x="660" y="213" text-anchor="middle" font-size="10" fill="#7a5200">the app asserts the grant</text>
    <text x="822" y="213" text-anchor="middle" font-size="10" fill="#7a5200">the app sees the full list</text>
    <text x="1018" y="213" text-anchor="middle" font-size="10" fill="#7a5200">presents a cms_smart assertion</text>
    <line x1="1150" y1="209" x2="1166" y2="209" stroke="#cc8400" stroke-width="1.4" marker-end="url(#lo)"/>
  </g>

  <!-- outlet -->
  <text x="1200" y="168" text-anchor="middle" font-size="10.5" fill="#777">FHIR</text>
  <text x="1200" y="182" text-anchor="middle" font-size="10.5" fill="#777">data</text>
  <text x="1200" y="196" text-anchor="middle" font-size="10.5" fill="#777">flows</text>
</svg>
