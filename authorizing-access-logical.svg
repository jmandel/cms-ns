<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Tile 1: app known -->
  <g>
    <rect x="24" y="86" width="148" height="108" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="98" y="118" text-anchor="middle" font-size="14" font-weight="600">The app</text>
    <text x="98" y="136" text-anchor="middle" font-size="14" font-weight="600">is known</text>
    <text x="98" y="162" text-anchor="middle" font-size="11.5" fill="#555">CMS Library</text>
    <text x="98" y="177" text-anchor="middle" font-size="11.5" fill="#555">software statement</text>
  </g>

  <line x1="172" y1="140" x2="206" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- Tile 2: Maria known -->
  <g>
    <rect x="210" y="86" width="148" height="108" rx="9" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="284" y="118" text-anchor="middle" font-size="14" font-weight="600">Maria is known</text>
    <text x="284" y="136" text-anchor="middle" font-size="14" font-weight="600">at IAL2</text>
    <text x="284" y="162" text-anchor="middle" font-size="11.5" fill="#555">the app sends her</text>
    <text x="284" y="177" text-anchor="middle" font-size="11.5" fill="#555">to the CSP, as today</text>
  </g>

  <line x1="358" y1="140" x2="396" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>
  <text x="377" y="128" text-anchor="middle" font-size="10.5" fill="#777">id_token</text>

  <!-- Group: Maria decides -->
  <g>
    <rect x="400" y="54" width="356" height="170" rx="11" fill="none" stroke="#9db8aa" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="578" y="44" text-anchor="middle" font-size="12" font-style="italic" fill="#0f5132">Maria decides, informed by the map — in either order</text>

    <!-- Tile 3: grant captured -->
    <rect x="414" y="86" width="152" height="108" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="552" cy="100" r="10.5" fill="#0f5132"/>
    <text x="552" y="104.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">1</text>
    <text x="482" y="116" text-anchor="middle" font-size="14" font-weight="600">Her grant</text>
    <text x="482" y="134" text-anchor="middle" font-size="14" font-weight="600">is captured</text>
    <rect x="426" y="148" width="128" height="17" rx="8.5" fill="#0f5132"/>
    <text x="490" y="160.5" text-anchor="middle" font-size="10.5" fill="#fff">a shared service records it</text>
    <rect x="426" y="170" width="128" height="17" rx="8.5" fill="#fff" stroke="#9db8aa"/>
    <text x="490" y="182.5" text-anchor="middle" font-size="10.5" fill="#3c5d4b">the app asserts it</text>

    <!-- coupling -->
    <text x="578" y="145" text-anchor="middle" font-size="15" fill="#555">&#8644;</text>

    <!-- Tile 4: records located -->
    <rect x="590" y="86" width="152" height="108" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="728" cy="100" r="10.5" fill="#0f5132"/>
    <text x="728" y="104.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">2</text>
    <text x="658" y="116" text-anchor="middle" font-size="14" font-weight="600">Her records</text>
    <text x="658" y="134" text-anchor="middle" font-size="14" font-weight="600">are located</text>
    <rect x="602" y="148" width="128" height="17" rx="8.5" fill="#0f5132"/>
    <text x="666" y="160.5" text-anchor="middle" font-size="10.5" fill="#fff">the service sees the map</text>
    <rect x="602" y="170" width="128" height="17" rx="8.5" fill="#fff" stroke="#9db8aa"/>
    <text x="666" y="182.5" text-anchor="middle" font-size="10.5" fill="#3c5d4b">the app sees the map</text>
  </g>

  <line x1="756" y1="140" x2="794" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#la)"/>
  <text x="775" y="121" text-anchor="middle" font-size="10.5" fill="#777">grant +</text>
  <text x="775" y="133" text-anchor="middle" font-size="10.5" fill="#777">site list</text>

  <!-- Tile 5: tokens at each data holder, stacked -->
  <g>
    <rect x="806" y="78" width="152" height="108" rx="9" fill="#f4f4f5" stroke="#d4d4d4"/>
    <rect x="802" y="82" width="152" height="108" rx="9" fill="#f4f4f5" stroke="#d4d4d4"/>
    <rect x="798" y="86" width="152" height="108" rx="9" fill="#fff" stroke="#0f5132" stroke-width="1.2"/>
    <circle cx="936" cy="100" r="10.5" fill="#0f5132"/>
    <text x="936" y="104.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">3</text>
    <text x="868" y="112" text-anchor="middle" font-size="13.5" font-weight="600">Each data holder</text>
    <text x="868" y="129" text-anchor="middle" font-size="13.5" font-weight="600">issues its own token</text>
    <text x="874" y="145" text-anchor="middle" font-size="10.5" fill="#555">verifies the app · Maria · the grant</text>
    <rect x="810" y="153" width="60" height="17" rx="8.5" fill="#0f5132"/>
    <text x="840" y="165.5" text-anchor="middle" font-size="10.5" fill="#fff">ticket</text>
    <rect x="876" y="153" width="66" height="17" rx="8.5" fill="#fff" stroke="#9db8aa"/>
    <text x="909" y="165.5" text-anchor="middle" font-size="10.5" fill="#3c5d4b">cms_smart</text>
    <text x="868" y="183" text-anchor="middle" font-size="10.5" fill="#777">then FHIR data flows</text>
  </g>

  <!-- caption -->
  <g font-size="11.5" fill="#555">
    <rect x="306" y="252" width="13" height="13" rx="6.5" fill="#0f5132"/>
    <text x="326" y="263">core story</text>
    <rect x="404" y="252" width="13" height="13" rx="6.5" fill="#fff" stroke="#9db8aa"/>
    <text x="424" y="263">the alternative assembly at that choice point</text>
    <circle cx="660" cy="258.5" r="8.5" fill="#0f5132"/>
    <text x="660" y="262.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">n</text>
    <text x="676" y="263">numbered choice points, detailed below</text>
  </g>
</svg>
