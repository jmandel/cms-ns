<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 790" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <g stroke="#d4d4d4" stroke-width="1">
    <line x1="80"  y1="62" x2="80"  y2="600"/>
    <line x1="280" y1="62" x2="280" y2="600"/>
    <line x1="470" y1="62" x2="470" y2="600"/>
    <line x1="680" y1="62" x2="680" y2="600"/>
    <line x1="895" y1="62" x2="895" y2="600"/>
  </g>

  <!-- actor boxes -->
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <rect x="22"  y="14" width="116" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d4"/>
    <text x="80" y="40">BP Buddy</text>
    <rect x="225" y="14" width="110" height="44" rx="6" fill="#fff" stroke="#0f5132"/>
    <text x="280" y="34">Maria</text>
    <text x="280" y="50" font-weight="400" font-size="11.5" fill="#555">(in her browser)</text>
    <rect x="408" y="14" width="124" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d4"/>
    <text x="470" y="34">IAL2 CSP</text>
    <text x="470" y="50" font-weight="400" font-size="11.5" fill="#555">CLEAR / ID.me</text>
    <rect x="592" y="14" width="176" height="44" rx="6" fill="#e7f1ec" stroke="#0f5132"/>
    <text x="680" y="34">Shared authorization</text>
    <text x="680" y="50">service</text>
    <rect x="822" y="14" width="146" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d4"/>
    <text x="895" y="34">Data holders</text>
    <text x="895" y="50" font-weight="400" font-size="11.5" fill="#555">(each one)</text>
  </g>

  <!-- messages -->
  <g font-size="12.5" fill="#1a1a1a">
    <!-- 1: app sends Maria -->
    <line x1="80" y1="95" x2="276" y2="95" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="92" y="88">opens the authorization step</text>

    <!-- 2: Maria arrives, choice 1 -->
    <line x1="280" y1="133" x2="676" y2="133" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="300" y="126">arrives carrying the app's request (Library-backed client identity)</text>
    <circle cx="664" cy="115" r="11" fill="#0f5132"/>
    <text x="664" y="119.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">1</text>

    <!-- 3: sign-in with CSP -->
    <line x1="680" y1="178" x2="474" y2="178" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="487" y="171">sign-in: id_token_hint, silent if Maria's CSP session is live</text>
    <circle cx="492" cy="160" r="9" fill="#fff" stroke="#0f5132" stroke-width="1.5"/>
    <text x="492" y="164" text-anchor="middle" fill="#0f5132" font-weight="700" font-size="11">a</text>
    <line x1="470" y1="212" x2="676" y2="212" stroke="#888" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
    <text x="487" y="205" fill="#555">fresh IAL2 id_token, audienced to the service</text>

    <!-- 4: record location lookup, self message -->
    <path d="M 680 245 C 730 245 730 273 680 273" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="500" y="252">record location lookup: its own network,</text>
    <text x="500" y="267">plus peer networks it has agreements with</text>

    <!-- 5: selection screen, choice 2 -->
    <line x1="680" y1="312" x2="284" y2="312" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="316" y="305">shows the matches; Maria picks sites and scopes</text>
    <circle cx="302" cy="294" r="11" fill="#0f5132"/>
    <text x="302" y="298.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">2</text>
    <line x1="280" y1="345" x2="676" y2="345" stroke="#888" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
    <text x="430" y="338" fill="#555">approves</text>

    <!-- 6: redirect back with tickets -->
    <line x1="680" y1="385" x2="84" y2="385" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="96" y="378">redirect back; token response: per-site permission tickets + endpoint hints</text>

    <!-- loop box for data holders -->
    <rect x="48" y="412" width="900" height="160" fill="none" stroke="#bbb" stroke-dasharray="6 4" rx="4"/>
    <rect x="48" y="412" width="252" height="20" fill="#f4f4f5" stroke="#bbb"/>
    <text x="58" y="426" font-size="11.5" fill="#555" font-style="italic">for each data holder Maria chose</text>

    <!-- 7: redeem, choice 3 -->
    <line x1="80" y1="466" x2="891" y2="466" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="120" y="459">redeems that site's ticket at the data holder's token endpoint (app key + ticket)</text>
    <circle cx="104" cy="448" r="11" fill="#0f5132"/>
    <text x="104" y="452.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">3</text>

    <!-- 8: token back -->
    <line x1="895" y1="506" x2="84" y2="506" stroke="#888" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
    <text x="120" y="499" fill="#555">access token + matched patient id (the data holder's own token, after its own checks)</text>

    <!-- 9: FHIR -->
    <line x1="80" y1="546" x2="891" y2="546" stroke="#1a1a1a" marker-end="url(#arr)"/>
    <text x="120" y="539">FHIR queries with that token</text>
  </g>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="48" y="618" width="900" height="158" rx="6" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="64" y="642" font-weight="700" font-size="13">Choice points — each can be assembled the other way</text>

    <circle cx="74" cy="664" r="10" fill="#0f5132"/>
    <text x="74" y="668.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11.5">1</text>
    <text x="94" y="668"><tspan font-weight="600">Where the grant is established.</tspan> Shown: authorization step at a shared service. Or: client_credentials + $rls, with the app attesting authorization.</text>

    <circle cx="74" cy="692" r="10" fill="#0f5132"/>
    <text x="74" y="696.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11.5">2</text>
    <text x="94" y="696"><tspan font-weight="600">Where Maria narrows sites.</tspan> Shown: on the service's screen, before the app learns anything. Or: in the app, after it sees every match.</text>

    <circle cx="74" cy="720" r="10" fill="#0f5132"/>
    <text x="74" y="724.5" text-anchor="middle" fill="#fff" font-weight="700" font-size="11.5">3</text>
    <text x="94" y="724"><tspan font-weight="600">What the app presents at each data holder.</tspan> Shown: ticket redemption. Or: client_credentials with the cms_smart extension.</text>

    <circle cx="74" cy="748" r="9" fill="#fff" stroke="#0f5132" stroke-width="1.5"/>
    <text x="74" y="752" text-anchor="middle" fill="#0f5132" font-weight="700" font-size="11">a</text>
    <text x="94" y="752"><tspan font-weight="600">How Maria signs in.</tspan> Shown: CSP federated into the step via id_token_hint. Or: the app passes its IAL2 id_token as the sign-in.</text>
  </g>
</svg>
